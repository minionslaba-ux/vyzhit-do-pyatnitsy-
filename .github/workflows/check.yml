# Автопроверка игры на каждый пуш и pull request (бесплатно, без Claude и без ключей):
# синтаксис JS, все JSON, английские переводы, списки файлов для офлайн-режима и сборки каталогов.
name: Проверка игры
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверки (tools/release.py --check)
        run: python3 tools/release.py --check
