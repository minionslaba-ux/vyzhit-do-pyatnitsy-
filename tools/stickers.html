// ---------- 3D-предметы (простые формы в стиле героев)
function phys(T, color, rough = 0.4, extra = {}) { return new T.MeshPhysicalMaterial({ color, roughness: rough, metalness: 0, ...extra }); }
function mk(T, geo, m, x = 0, y = 0, z = 0, parent) { const o = new T.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; parent.add(o); return o; }
const BUILD = {
  cup(T) {
    const g = new T.Group();
    mk(T, new T.CylinderGeometry(0.045, 0.036, 0.11, 28), phys(T, '#ffffff', 0.3, { clearcoat: 0.8 }), 0, 0, 0, g);
    mk(T, new T.CylinderGeometry(0.047, 0.043, 0.042, 28), phys(T, '#ff3bd4', 0.5), 0, -0.004, 0, g);
    mk(T, new T.CylinderGeometry(0.048, 0.048, 0.016, 28), phys(T, '#2a2026', 0.4), 0, 0.058, 0, g);
    const h = mk(T, new T.TorusGeometry(0.024, 0.007, 8, 20), phys(T, '#ffffff', 0.3), 0.048, 0.005, 0, g);
    return g;
  },
  mug(T) { const g = BUILD.cup(T); g.scale.setScalar(0.9); return g; },
  phone(T) {
    const g = new T.Group();
    mk(T, new T.BoxGeometry(0.075, 0.15, 0.012), phys(T, '#15151c', 0.25, { clearcoat: 1 }), 0, 0, 0, g);
    const sc = new T.Mesh(new T.PlaneGeometry(0.066, 0.135), new T.MeshBasicMaterial({ color: '#2de2e6' })); sc.position.z = 0.0065; g.add(sc);
    return g;
  },
  laptop(T) {
    const g = new T.Group(), alu = phys(T, '#c9ccd4', 0.3, { metalness: 0.6, clearcoat: 0.6 });
    mk(T, new T.BoxGeometry(0.4, 0.018, 0.27), alu, 0, 0, 0, g);
    const lid = new T.Group(); lid.position.set(0, 0.009, -0.135); g.add(lid); lid.rotation.x = -0.25;
    mk(T, new T.BoxGeometry(0.4, 0.27, 0.012), alu, 0, 0.135, 0, lid);
    const sc = new T.Mesh(new T.PlaneGeometry(0.37, 0.24), new T.MeshBasicMaterial({ color: '#2a3a6a' })); sc.position.set(0, 0.135, 0.0065); lid.add(sc);
    const logo = new T.Mesh(new T.CircleGeometry(0.03, 24), new T.MeshBasicMaterial({ color: '#2de2e6' })); logo.position.set(0, 0.135, -0.0065); logo.rotation.y = PI; lid.add(logo);
    mk(T, new T.BoxGeometry(0.36, 0.004, 0.12), phys(T, '#2a2a30', 0.6), 0, 0.011, 0.03, g);
    return g;
  },
  box(T) {
    const g = new T.Group(), card = phys(T, '#c8955a', 0.85);
    mk(T, new T.BoxGeometry(0.46, 0.26, 0.3), card, 0, 0, 0, g);
    mk(T, new T.BoxGeometry(0.47, 0.03, 0.31), phys(T, '#d9b07a', 0.6), 0, 0.06, 0, g);
    return g;
  },
  shades(T) {
    const g = new T.Group(), m = phys(T, '#101014', 0.15, { clearcoat: 1 });
    for (const s of [-1, 1]) { const l = mk(T, new T.CylinderGeometry(0.03, 0.03, 0.008, 28), m, s * 0.042, 0.016, 0.124, g); l.rotation.x = PI / 2; l.scale.z = 0.78; }
    mk(T, new T.BoxGeometry(0.028, 0.005, 0.005), m, 0, 0.026, 0.126, g);
    for (const s of [-1, 1]) { const a = mk(T, new T.BoxGeometry(0.004, 0.004, 0.1), m, s * 0.072, 0.022, 0.075, g); a.rotation.y = s * 0.12; }
    return g;
  },
};

// ---------- поза
function pose(T, hero, h) {
  const u = hero.userData;
  hero.position.set(h.x || 0, 0, h.z || 0);
  hero.rotation.y = h.yaw || 0;
  const arms = h.arms || ['down', 'down'];
  u.arms.forEach((a, i) => {
    const sg = i ? 1 : -1, sp = typeof arms[i] === 'string' ? ARM[arms[i]] : arms[i];
    const [x, y, z, e, o = 'XYZ'] = sp;
    a.sh.rotation.set(x, sg * y, a.rest + sg * z, o);
    a.el.rotation.x = e;
  });

// ---------- 2D: подпись, декор, обводка
const DARK = '#1d1640';

      const t = line ? line + ' ' + w : w;
      if (line && g.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function layoutCaption(g, text) {
  const maxW = 470;
  for (let fs = 64; fs >= 26; fs -= 2) {
    g.font = `900 ${fs}px Unbounded, "Noto Color Emoji", sans-serif`;
    const lines = wrap(g, text, maxW);
    if (lines.length <= 2 && lines.every(l => g.measureText(l).width <= maxW)) return { fs, lines, lh: fs * 1.08 };
  }
  g.font = `900 26px Unbounded, "Noto Color Emoji", sans-serif`;
  return { fs: 26, lines: wrap(g, text, maxW), lh: 28 };
}
function drawCaption(g, cap, y0) {
  const { fs, lines, lh } = cap;

  g.font = `900 ${fs}px Unbounded, "Noto Color Emoji", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.miterLimit = 2;
  lines.forEach((l, i) => {

    g.strokeStyle = '#fff'; g.lineWidth = Math.max(9, fs * 0.3); g.strokeText(l, 0, y); g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = Math.max(9, fs * 0.3); g.strokeText(l, 0, y);
    g.fillStyle = DARK; g.fillText(l, 0, y);

}
function rng(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function drawBurst(g, d) {

}

}
function drawConfetti(g, n) {
  const r = rng(N * 7 + 3), cols = ['#ff3bd4', '#2de2e6', '#d4ff3a', '#ffb02e', '#8f6bff'];

}
function drawEmoji(g, d) {

// белая «наклейная» обводка вокруг всего непрозрачного + мягкая тень
function outlined(src, rad) {

  const sil = document.createElement('canvas'); sil.width = sil.height = S; const sg = sil.getContext('2d');

async function watermark(g) {
  const img = new Image(); img.src = '../icons/favicon-96.png'; await img.decode();
  const x = 300, y = 482, sz = 26;
  g.save();
  g.shadowColor = 'rgba(20,10,40,.4)'; g.shadowBlur = 3;
  g.beginPath(); g.roundRect(x - 2, y - 2, sz + 4, sz + 4, 8); g.fillStyle = '#fff'; g.fill(); g.restore();
  g.save(); g.beginPath(); g.roundRect(x, y, sz, sz, 6); g.clip(); g.drawImage(img, x, y, sz, sz); g.restore();
  g.save(); g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';

// ---------- кадрирование: проекция всех вершин → подгонка под прямоугольник через setViewOffset
function screenBounds(T, cam, roots) {

  });

async function main() {
  const st = STICKERS[N - 1];
  const sample = 'Привет, ёЁ survivefriday.com 18:00 (…)!?';
  await Promise.all(['900 60px Unbounded', '900 12px Nunito'].map(f => document.fonts.load(f, sample))); await document.fonts.ready;
  const T = await three();
  const glc = document.getElementById('gl');
  const renderer = new T.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(S, S, false); renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = T.SRGBColorSpace; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  scene.add(new T.HemisphereLight('#eef2ff', '#4a3a5a', 1.15));
  const key = new T.DirectionalLight('#fff1e2', 2.3); key.position.set(1.8, 3.4, 3.0); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 2.4, bottom: -0.6, near: 0.5, far: 9 }); scene.add(key);
  const fill = new T.DirectionalLight('#ffe7da', 0.95); fill.position.set(-1.4, 1.4, 3); scene.add(fill);
  const rim = new T.DirectionalLight('#7ff3ff', 2.0); rim.position.set(-2.4, 2.4, -2.6); scene.add(rim);
  const rim2 = new T.DirectionalLight('#ff8ae6', 1.1); rim2.position.set(2.6, 1.4, -2.2); scene.add(rim2);

  const roots = [];
  for (const h of st.heroes) {
    const base = KIDS[h.p] || HERO_PRESETS.find(p => p.id === h.p);
    const hero = buildHero(T, { ...base, ...(h.wear || {}) });
    hero.userData.head.scale.multiplyScalar(h.p.startsWith('kid') ? 1.05 : 1.15);  // стикерная пропорция: голова чуть крупнее — эмоции читаются
    pose(T, hero, h); attachProps(T, hero, h);
    scene.add(hero); roots.push(hero);
  }
  scene.updateMatrixWorld(true);
  scene.traverse(o => { if (o.userData.upright && o.parent) { const q = o.parent.getWorldQuaternion(new T.Quaternion()).invert(); o.quaternion.copy(q); } });
  scene.updateMatrixWorld(true);

  // камера: лёгкий ракурс сбоку и сверху, смотрим в центр фигур
  const box = new T.Box3(); roots.forEach(r => box.expandByObject(r));
  const ctr = box.getCenter(new T.Vector3()), [az, el] = st.cam || [0.3, 0.1], dist = 5.2;
  const cam = new T.PerspectiveCamera(26, 1, 0.1, 30);
  cam.position.set(ctr.x + Math.sin(az) * Math.cos(el) * dist, ctr.y + Math.sin(el) * dist, ctr.z + Math.cos(az) * Math.cos(el) * dist);
  cam.lookAt(ctr); cam.updateMatrixWorld(); cam.updateProjectionMatrix();

  // подпись внизу, водяной знак под ней; персонаж — в прямоугольнике над подписью (с нахлёстом)

  const cap = layoutCaption(og, st.cap), capH = cap.lines.length * cap.lh, capBottom = 476, capTop = capBottom - capH;
  const pad = 12 + (st.fitPad || 0), fitBottom = capTop + capH * (st.overlap ?? 0.7);  // подпись перекрывает голени — фигура крупнее
  const tr = [pad, pad, S - pad, fitBottom];

  // crop < 1 — «по колено»: верх фигуры у верхнего края, доля crop высоты фигуры доходит до нижнего края (голени — за подписью);
  // crop = 1 — фигура целиком над/за подписью (прыжки, мотоцикл)
  const crop = st.crop ?? 0.8, fh = b[3] - b[1];

  else { s = Math.min((tr[2] - tr[0]) / (b[2] - b[0]), (tr[3] - tr[1]) / fh); offY = b[3] - tr[3] / s; }

  for (const d of st.decor || []) if (d.confetti) drawConfetti(lg, d.confetti);
  for (const d of st.decor || []) if (d.e && !d.front) drawEmoji(lg, d);  // эмодзи — за персонажем (front — поверх)
  lg.drawImage(glc, 0, 0);

  if ((st.crop ?? 0.8) < 1) {  // фигура обрезана снизу — мягко растворяем срез за подписью, под ней чисто (там водяной знак)
