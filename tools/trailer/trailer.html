<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Заставка «Выжить до пятницы», 18 с. Кадры настоящей игры снимает capture.js (Playwright),
     здесь — монтаж: склейки в ритм 128 bpm, зум, крупные подписи, карьера и финальная карточка.
     frame(t) рисует момент t (с); render.js вызывает его 30 раз в секунду. Адрес: trailer.html?cap=<папка кадров>&mode=tall|wide -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Nunito:wght@800;900&family=JetBrains+Mono:wght@700;800&display=block" rel="stylesheet">
<style>
:root { --bg: #07070d; --mag: #ff3bd4; --cyan: #2de2e6; --lime: #d4ff3a; --red: #ff3b6b; --text: #f2f0ff; }
* { box-sizing: border-box; margin: 0; }
html, body { overflow: hidden; background: var(--bg); color: var(--text); font-family: Nunito, sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
body.wide #stage { width: 960px; height: 540px; }
.abs { position: absolute; }
#bg { inset: -10%; background: radial-gradient(60% 45% at 12% 100%, rgba(178,107,255,.45), transparent 60%), radial-gradient(55% 40% at 95% 0%, rgba(45,226,230,.35), transparent 60%), radial-gradient(50% 40% at 70% 70%, rgba(255,59,212,.22), transparent 60%), var(--bg); }
#grid { inset: 0; background-image: linear-gradient(rgba(45,226,230,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(45,226,230,.07) 1px, transparent 1px); background-size: 40px 40px; }
/* «экран» игры: в вертикальном формате — весь кадр, в горизонтальном — телефон справа */
#phone { left: 0; top: 0; width: 540px; height: 960px; overflow: hidden; }
body.wide #phone { left: 610px; top: 24px; width: 276px; height: 492px; border-radius: 32px; box-shadow: 0 0 0 7px #15151f, 0 0 0 9px rgba(255,59,212,.75), 0 0 60px rgba(255,59,212,.45), 0 30px 80px rgba(0,0,0,.6); }
#vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#vidDim { inset: 0; background: #07070d; opacity: 0; }
/* подписи */
.cap { position: absolute; left: 0; right: 0; text-align: center; font-family: Unbounded; font-weight: 900; text-transform: uppercase; line-height: 1; opacity: 0; }
.cap > span { display: inline-block; padding: 12px 20px 14px; border-radius: 16px; background: rgba(7,7,13,.88); box-shadow: 0 10px 40px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.08); }
.cap i { font-style: normal; }
.cap .l { color: var(--lime); text-shadow: 0 0 18px rgba(212,255,58,.7); } .cap .m { color: var(--mag); text-shadow: 0 0 18px rgba(255,59,212,.8); } .cap .c { color: var(--cyan); text-shadow: 0 0 18px rgba(45,226,230,.8); } .cap .r { color: var(--red); text-shadow: 0 0 18px rgba(255,59,107,.8); }
.cap.big { font-size: 48px; } .cap.mid { font-size: 34px; }
.cap .sub { display: block; margin-top: 10px; font-family: Nunito; font-weight: 900; font-size: 22px; text-transform: none; color: #fff; }
body.wide .cap { left: 40px; right: auto; width: 520px; }
body.wide .cap > span { background: none; box-shadow: none; padding: 0; }
body.wide .cap.big { font-size: 52px; } body.wide .cap.mid { font-size: 40px; }
/* крючок */
#hook { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: Unbounded; font-weight: 900; text-transform: uppercase; line-height: .95; }
#hook .w1 { font-size: 58px; color: #fff; text-shadow: 0 0 26px rgba(255,59,212,.7), 0 6px 0 rgba(0,0,0,.4); }
#hook .w2 { font-size: 50px; color: var(--mag); text-shadow: 0 0 22px var(--mag), 0 0 60px rgba(255,59,212,.6); margin-top: 8px; }
#hook .clk { margin-top: 34px; font-family: 'JetBrains Mono'; font-weight: 800; font-size: 80px; color: #7df9ff; text-shadow: 0 0 16px var(--cyan), 0 0 50px rgba(45,226,230,.6); }
#hook .clk.hot { color: #ff8be6; text-shadow: 0 0 16px var(--mag), 0 0 50px rgba(255,59,212,.7); }
/* карьера */
#career { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
#career h2 { font-family: Unbounded; font-weight: 900; font-size: 54px; text-transform: uppercase; color: #fff; text-shadow: 0 0 22px rgba(255,59,212,.7); }
#career .x { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 26px; color: var(--lime); text-shadow: 0 0 14px rgba(212,255,58,.7); margin-bottom: 10px; }
#career .lv { display: flex; align-items: center; gap: 16px; width: 450px; padding: 16px 20px; border-radius: 22px; background: rgba(20,20,34,.94); border: 2px solid var(--cl); box-shadow: 0 0 30px var(--cs); }
#career .lv i { font-style: normal; font-size: 44px; }
#career .lv b { display: block; font-family: Unbounded; font-weight: 800; font-size: 23px; color: #fff; text-transform: uppercase; }
#career .lv small { display: block; margin-top: 4px; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 15px; color: var(--cl); }
#career .lv:nth-of-type(1) { --cl: #2de2e6; --cs: rgba(45,226,230,.35); } #career .lv:nth-of-type(2) { --cl: #d4ff3a; --cs: rgba(212,255,58,.3); } #career .lv:nth-of-type(3) { --cl: #ff3bd4; --cs: rgba(255,59,212,.45); }
body.wide #career { right: 360px; gap: 9px; } body.wide #hook { right: 360px; } body.wide #career h2 { font-size: 46px; } body.wide #career .lv { width: 500px; padding: 10px 18px; } body.wide #career .x { font-size: 22px; margin-bottom: 4px; }
/* мини-игры: счётчик */
#fifty { left: 0; right: 0; top: 30px; text-align: center; font-family: Unbounded; font-weight: 900; text-transform: uppercase; opacity: 0; }
#fifty b { display: inline-block; font-size: 50px; line-height: 1; padding: 10px 22px 14px; border-radius: 18px; background: var(--lime); color: #07070d; box-shadow: 0 0 40px rgba(212,255,58,.6); }
#fifty small { display: block; margin-top: 12px; font-size: 28px; color: #fff; }
#fifty small span { display: inline-block; padding: 6px 16px 8px; border-radius: 12px; background: rgba(7,7,13,.88); }
body.wide #fifty { left: 40px; right: auto; width: 520px; top: 180px; } body.wide #fifty b { font-size: 46px; white-space: nowrap; } body.wide #fifty small span { background: none; }
/* финал */
#end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
#end .logo .a { display: block; font-family: Unbounded; font-weight: 900; font-size: 76px; color: #fff; text-transform: uppercase; line-height: 1; text-shadow: 0 0 26px rgba(255,59,212,.6); }
#end .logo .b { display: block; font-family: Unbounded; font-weight: 900; font-size: 54px; color: var(--mag); text-transform: uppercase; line-height: 1.05; text-shadow: 0 0 20px var(--mag), 0 0 60px rgba(255,59,212,.6); }
#end .free { font-family: Unbounded; font-weight: 900; font-size: 30px; text-transform: uppercase; padding: 16px 32px 18px; border-radius: 99px; background: var(--lime); color: #07070d; box-shadow: 0 0 40px rgba(212,255,58,.6); }
#end .url { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 32px; color: #7df9ff; text-shadow: 0 0 14px var(--cyan); }
#end .tags { font-family: Nunito; font-weight: 900; font-size: 19px; color: #c9c4e6; }
#fan { inset: 0; }
#fan img { position: absolute; width: 190px; height: 338px; border-radius: 22px; box-shadow: 0 0 0 4px #15151f, 0 0 0 6px rgba(45,226,230,.5), 0 20px 50px rgba(0,0,0,.6); object-fit: cover; }
body.wide #end { gap: 18px; } body.wide #end .logo .a { font-size: 66px; } body.wide #end .logo .b { font-size: 47px; }
#flash { inset: 0; background: #fff; opacity: 0; }
#vign { inset: 0; background: radial-gradient(80% 70% at 50% 50%, transparent 50%, rgba(255,30,80,.7)); opacity: 0; }
#bar { left: 0; bottom: 0; height: 5px; width: 0; background: linear-gradient(90deg, var(--cyan), var(--mag), var(--lime)); box-shadow: 0 0 12px var(--mag); }
</style></head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div><div id="grid" class="abs"></div>
  <div id="phone" class="abs"><img id="vid" alt=""><div id="vidDim" class="abs"></div></div>
  <div id="vign" class="abs"></div>
  <div id="caps"></div>
  <div id="fifty" class="abs"><b>50 мини-игр</b><small><span id="fiftySub"></span></small></div>
  <div id="hook" class="abs"><div class="w1">Доживёшь</div><div class="w2">до пятницы?</div><div class="clk" id="hookClk">09:00</div></div>
  <div id="career" class="abs"><h2>Карьера</h2><div class="x">3 уровня × 52 недели</div>
    <div class="lv"><i>🐟</i><div><b>Офисный планктон</b><small>год 1 · дедлайны и кулер</small></div></div>
    <div class="lv"><i>📊</i><div><b>Средний менеджмент</b><small>год 2 · интриги и планёрки</small></div></div>
    <div class="lv"><i>👑</i><div><b>Топ-менеджмент</b><small>год 3 · самые жёсткие решения</small></div></div></div>
  <div id="fan" class="abs"></div>
  <div id="end" class="abs"><div class="logo"><span class="a">Выжить</span><span class="b">до пятницы</span></div>
    <div class="free">Играй бесплатно</div><div class="url">survivefriday.com</div><div class="tags">Без регистрации · в браузере и на телефоне</div></div>
  <div id="flash" class="abs"></div>
  <div id="bar" class="abs"></div>
</div>
<script>
const Q = new URLSearchParams(location.search), CAP = (Q.get('cap') || 'cap').replace(/\/$/, ''), WIDE = Q.get('mode') === 'wide', POSTER = Q.has('poster');  // poster — кадр для обложки: игра под заголовком не размыта
if (WIDE) document.body.classList.add('wide');
const SW = WIDE ? 960 : 540, SH = WIDE ? 540 : 960;
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => cl((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - x, 3), back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
// Ритм: 128 bpm, «дроп» в 2,1 с; все склейки — на долях (те же числа — в sound.py)
const B = 60 / 128, D = 2.1, at = k => D + k * B, DUR = 18;
const END = at(28.5);
// Клипы: [папка, t0, t1, первый кадр, скорость, зум в начале, зум в конце, фокус x %, фокус y %, куски кадров — растягиваются на весь клип]
const CLIPS = [
  ['card', 0, at(0), 0, 0.2, 1.3, 1.22, 50, 30],
  ['card', at(0), at(6), 0, 1.0, 1.1, 1.0, 50, 45, [[6, 37], [44, 93]]],  // без пустых кадров между карточками
  ['danger', at(6), at(9), 2, 1.0, 1.3, 1.6, 50, 21],
  ['hero', at(9), at(12), 0, 1.2, 1.3, 1.45, 50, 30],
  ['hero', at(12), at(15), 50, 0, 1.5, 1.6, 30, 38],
  ['moto', at(15), at(17.5), 0, 0.75, 1.4, 1.3, 64, 42],
  ['flowers', at(17.5), at(19), 4, 1.0, 1.55, 1.45, 50, 42],
  ['pet', at(19), at(20.5), 4, 1.0, 1.55, 1.45, 50, 42],
  ['b13', at(20.5), at(21.5), 2, 1.0, 1.2, 1.1, 50, 58],
  ['b22', at(21.5), at(22.5), 2, 1.0, 1.2, 1.1, 50, 58],
  ['b1', at(22.5), at(23.5), 2, 1.0, 1.25, 1.15, 50, 45],
  ['b32', at(23.5), at(24.5), 2, 1.0, 1.25, 1.15, 50, 45],
  ['b11', at(24.5), at(25.5), 2, 1.0, 1.25, 1.15, 50, 45],
  ['store', at(25.5), at(26.5), 4, 1.0, 1.2, 1.1, 50, 35],
  ['feed', at(26.5), at(27.5), 6, 1.0, 1.2, 1.1, 50, 30],
  ['board', at(27.5), at(28.5), 6, 1.0, 1.2, 1.1, 50, 35],
];
const FRAMES = { card: 110, danger: 50, hero: 54, moto: 45, flowers: 32, pet: 32, b13: 22, b22: 22, b1: 22, b32: 22, b11: 22, store: 26, feed: 30, board: 30 };
// Подписи: [t0, t1, html, размер, y (доля высоты кадра), наклон °]
const CAPS = [
  [at(0) + .05, at(3), '<span><i class="l">Свайпай</i><br>решения</span>', 'big', .82, -3],
  [at(3), at(6), '<span>Держи <i class="c">4 шкалы</i><br>в балансе</span>', 'mid', .82, 2],
  [at(6) + .05, at(9), '<span><i class="r">0% или 100%</i><br>— конец недели!</span>', 'mid', .70, -2],
  [at(9) + .05, at(12), '<span>Твой <i class="m">3D&#8209;герой</i></span>', 'mid', .82, -2],
  [at(15) + .05, at(17.5), '<span>Покупай <i class="l">мечты</i></span>', 'big', .82, -3],
  [at(17.5), at(19), '<span><i class="m">Цветы</i>, мото, лодки</span>', 'mid', .82, 2],
  [at(19), at(20.5), '<span><i class="c">Питомцы</i> и дети</span>', 'mid', .82, -2],
  [at(25.5), at(26.5), '<span><i class="l">Магазин</i></span>', 'big', .86, -2],
  [at(26.5), at(27.5), '<span>Лента и <i class="m">подарки</i></span>', 'mid', .86, 2],
  [at(27.5), at(28.5), '<span>Рейтинг<br><i class="c">недели дня</i><i class="sub">офисы с коллегами</i></span>', 'mid', .83, -2],
];
const FIFTY = [[at(20.5), 'найди отличия'], [at(21.5), 'аркады'], [at(22.5), 'шашки'], [at(23.5), 'слова'], [at(24.5), 'пазлы']];
$('caps').innerHTML = CAPS.map(([, , h, c], i) => `<div class="cap ${c}" id="cap${i}">${h}</div>`).join('');
const src = (name, i) => `${CAP}/${name}/${String(Math.max(0, Math.min(FRAMES[name] - 1, i))).padStart(4, '0')}.jpg`;
// финальный веер из кадров игры: [папка, кадр, наклон, x, верх/низ]
const FAN = [['card', 60, -14, -150, 0], ['moto', 10, 12, 150, 0], ['board', 20, -9, -125, 1], ['b13', 15, 10, 135, 1]];
$('fan').innerHTML = FAN.map(([n, i]) => `<img src="${src(n, i)}" alt="">`).join('');
let lastSrc = '';
async function setVid(s) {
  if (s === lastSrc) return; lastSrc = s;
  const v = $('vid'); v.src = s; try { await v.decode(); } catch {}
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].filter(im => im.src).map(im => im.decode().catch(() => {}))]);

async function frame(t) {
  // кадр игры
  const c = CLIPS.find(c => t >= c[1] && t < c[2]);
  if (c) {
    const [name, t0, t1, f0, sp, z0, z1, fx, fy, parts] = c, k = (t - t0) / (t1 - t0);
    let fi = Math.round(f0 + (t - t0) * 30 * sp);
    if (parts) { let x = k * parts.reduce((a, [p, q]) => a + q - p, 0); for (const [p, q] of parts) { if (x < q - p) { fi = Math.floor(p + x); break; } x -= q - p; fi = q - 1; } }
    await setVid(src(name, fi));
    const punch = 1 + .1 * Math.pow(1 - seg(t, t0, t0 + .18), 2);  // «удар» зумом на склейке
    const v = $('vid');
    v.style.transformOrigin = `${fx}% ${fy}%`;
    v.style.transform = `scale(${lerp(z0, z1, ease(k)) * punch})`;
    v.style.filter = t < at(0) && !(POSTER && WIDE) ? 'blur(3px)' : 'none';
  }
  $('phone').style.opacity = t >= END ? 0 : 1;
  $('vidDim').style.opacity = t < at(0) ? (POSTER && WIDE ? .5 : .6) : (t >= at(12) && t < at(15)) ? .72 : 0;
  if (WIDE) $('phone').style.transform = `rotate(${-3 + Math.sin(t * .8) * .6}deg)`;
  // белая вспышка на склейках
  let fl = 0;
  for (const cc of CLIPS) if (t >= cc[1] && cc[1] > 0) fl = Math.max(fl, .35 * (1 - seg(t, cc[1], cc[1] + .12)));
  if (t >= at(0)) fl = Math.max(fl, .55 * (1 - seg(t, at(0), at(0) + .22)));
  if (t >= END) fl = Math.max(fl, .55 * (1 - seg(t, END, END + .25)));
  $('flash').style.opacity = fl;
  // крючок: «Доживёшь до пятницы?» и часы 09:00 → 18:00
  const hk = $('hook');
  hk.style.opacity = t < at(0) ? 1 : 0;
  if (t < at(0)) {
    const w1 = hk.querySelector('.w1'), w2 = hk.querySelector('.w2'), ck = $('hookClk');
    const a1 = seg(t, .02, .32), a2 = seg(t, .42, .72), a3 = seg(t, .8, 1.0);
    w1.style.transform = `scale(${lerp(2.6, 1, back(a1))})`; w1.style.opacity = a1 > 0 ? 1 : 0;
    w2.style.transform = `scale(${lerp(2.6, 1, back(a2))}) rotate(${-3 * a2}deg)`; w2.style.opacity = a2 > 0 ? 1 : 0;
    ck.style.opacity = a3; ck.style.transform = `translateY(${(1 - ease(a3)) * 30}px)`;
    const m = Math.min(18 * 60, Math.floor(lerp(9 * 60, 18 * 60, Math.pow(seg(t, .9, 1.9), 1.7))));
    ck.textContent = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    ck.classList.toggle('hot', m >= 17 * 60);
    const shake = t > 1.85 && !POSTER ? Math.sin(t * 90) * 5 : 0;
    hk.style.transform = `translateX(${shake}px) scale(${1 + .04 * seg(t, 1.5, 2.1)})`;
  }
  // подписи
  CAPS.forEach(([t0, t1, , cls, y, rot], i) => {
    const e = $('cap' + i), on = t >= t0 && t < t1;
    if (!on) { e.style.opacity = 0; return; }
    const a = seg(t, t0, t0 + .22), out = seg(t, t1 - .1, t1);
    e.style.top = (WIDE ? .5 : y) * SH + 'px';
    e.style.transform = `translateY(-50%) scale(${lerp(1.8, 1, back(a)) * (1 - .15 * out)}) rotate(${rot * (1 - a * .4)}deg)`;
    e.style.opacity = 1 - out;
  });
  // «50 мини-игр»
  const fOn = t >= at(20.5) && t < at(25.5), fi = $('fifty');
  fi.style.opacity = fOn ? 1 : 0;
  if (fOn) {
    const a = seg(t, at(20.5), at(20.5) + .25), sub = [...FIFTY].reverse().find(f => t >= f[0]);
    fi.querySelector('b').style.transform = `scale(${lerp(2, 1, back(a)) * (1 + .07 * Math.max(0, 1 - (t - sub[0]) / .15))}) rotate(-2deg)`;
    $('fiftySub').textContent = sub[1];
    $('fiftySub').style.transform = `scale(${lerp(1.5, 1, ease(seg(t, sub[0], sub[0] + .15)))})`;
  }
  // карьера: 3 уровня
  const cOn = t >= at(12) && t < at(15), ca = $('career');
  ca.style.opacity = cOn ? 1 - seg(t, at(15) - .1, at(15)) : 0;
  if (cOn) {
    ca.querySelector('h2').style.transform = `scale(${lerp(1.9, 1, back(seg(t, at(12), at(12) + .25)))})`;
    ca.querySelector('.x').style.opacity = seg(t, at(12) + .15, at(12) + .35);
    ca.querySelectorAll('.lv').forEach((e, i) => { const a = seg(t, at(12) + .3 + i * B * .8, at(12) + .55 + i * B * .8); e.style.opacity = a; e.style.transform = `translateX(${(1 - back(a)) * (i % 2 ? 320 : -320)}px)`; });
  }
  // опасность: красная пульсация в такт
  $('vign').style.opacity = t >= at(6) && t < at(9) ? .45 + .55 * Math.abs(Math.cos((t - at(6)) * Math.PI / B)) : 0;
  // финальная карточка
  const eOn = t >= END, en = $('end');
  en.style.opacity = eOn ? 1 : 0; $('fan').style.opacity = eOn ? 1 : 0;
  if (eOn) {
    const e = t - END;
    en.querySelector('.logo').style.transform = `scale(${lerp(2.3, 1, back(seg(e, 0, .35))) * (1 + .025 * Math.abs(Math.sin(e * Math.PI / B)))})`;
    const fr = en.querySelector('.free'), fa = seg(e, .3, .55); fr.style.opacity = fa; fr.style.transform = `scale(${lerp(.4, 1, back(fa)) * (1 + .045 * (e > .6 ? Math.abs(Math.sin((e - .6) * Math.PI / B)) : 0))})`;
    const ur = en.querySelector('.url'), ua = seg(e, .55, .8); ur.style.opacity = ua; ur.style.transform = `translateY(${(1 - ease(ua)) * 30}px)`;
    en.querySelector('.tags').style.opacity = seg(e, .85, 1.15);
    [...$('fan').children].forEach((im, i) => {
      const [, , rot, dx, low] = FAN[i], a = ease(seg(e, .05 + i * .06, .5 + i * .06));
      const x = SW / 2 - 95 + dx * (WIDE ? 2.6 : 1), y = WIDE ? (low ? 300 : -110) : (low ? 640 : -20);
      im.style.left = x + 'px'; im.style.top = (y + (1 - a) * (low ? 400 : -400)) + 'px';
      im.style.transform = `rotate(${rot + e * (i % 2 ? 1.5 : -1.5)}deg)`; im.style.opacity = .4 * a; im.style.filter = 'blur(1.5px)';
    });
  }
  $('bar').style.width = (t / END * 100) + '%';
  $('bar').style.opacity = eOn || POSTER ? 0 : 1;
}
window.frame = frame;
</script>
